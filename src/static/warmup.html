<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Розігрів: Додавання навчальної нотатки</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --border: #e2e8f0;
            --success: #16a34a;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 24px;
            display: flex;
            justify-content: center;
        }
        .container {
            max-width: 720px;
            width: 100%;
            background: var(--card-bg);
            padding: 32px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -2px rgba(0,0,0,0.1);
        }
        h1 {
            margin-top: 0;
            font-size: 1.6rem;
            color: #0f172a;
        }
        .desc {
            color: #64748b;
            font-size: 0.95rem;
            margin-bottom: 24px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            font-weight: 600;
            font-size: 0.85rem;
            margin-bottom: 6px;
            color: #334155;
        }
        input[type="text"], select, textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 0.95rem;
            font-family: inherit;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37,99,235,0.15);
        }
        textarea {
            min-height: 140px;
            resize: vertical;
        }
        .row {
            display: flex;
            gap: 16px;
        }
        .row .form-group {
            flex: 1;
        }
        .btn-submit {
            background-color: var(--primary);
            color: #ffffff;
            border: none;
            padding: 12px 20px;
            font-weight: 600;
            font-size: 0.95rem;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
            width: 100%;
        }
        .btn-submit:hover {
            background-color: var(--primary-hover);
        }
        .alert {
            display: none;
            margin-top: 16px;
            padding: 12px;
            border-radius: 6px;
            font-size: 0.9rem;
        }
        .alert.success {
            display: block;
            background-color: #dcfce7;
            color: var(--success);
            border: 1px solid #bbf7d0;
        }
        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: var(--primary);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📝 Додавання навчальної нотатки (Warmup)</h1>
        <p class="desc">Проста сторінка для швидкого захоплення знань безпосередньо у сховище Second Brain.</p>

        <form id="noteForm">
            <div class="form-group">
                <label for="title">Назва нотатки *</label>
                <input type="text" id="title" required placeholder="Наприклад: Архітектура систолічних масивів TPU">
            </div>

            <div class="row">
                <div class="form-group">
                    <label for="category">Категорія (PARA) *</label>
                    <select id="category">
                        <option value="Inbox" selected>Inbox (Швидке захоплення)</option>
                        <option value="Projects">Projects (Активні результати)</option>
                        <option value="Areas">Areas (Постійні сфери)</option>
                        <option value="Resources">Resources (Матеріали та знання)</option>
                        <option value="Archives">Archives (Архівоване)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="source">Першоджерело (не вигадувати!)</label>
                    <input type="text" id="source" placeholder="Наприклад: Конспект лекції №5 АСКС">
                </div>
            </div>

            <div class="form-group">
                <label for="tags">Теги (через кому)</label>
                <input type="text" id="tags" placeholder="architecture, hardware, tpu">
            </div>

            <div class="form-group">
                <label for="content">Зміст нотатки (Markdown & [[Вікі-зв'язки]]) *</label>
                <textarea id="content" required placeholder="Введіть основні твердження. Використовуйте [[Назва іншої нотатки]] для створення зв'язків."></textarea>
            </div>

            <button type="submit" class="btn-submit">💾 Зберегти навчальну нотатку</button>
        </form>

        <div id="statusAlert" class="alert"></div>

        <a href="/" class="back-link">← Перейти до головного інтерфейсу Second Brain</a>
    </div>

    <script>
        const form = document.getElementById('noteForm');
        const alertBox = document.getElementById('statusAlert');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const tags = document.getElementById('tags').value
                .split(',')
                .map(t => t.trim())
                .filter(Boolean);

            const payload = {
                title: document.getElementById('title').value.trim(),
                category: document.getElementById('category').value,
                source: document.getElementById('source').value.trim() || 'власний конспект',
                tags: tags,
                content: document.getElementById('content').value.trim()
            };

            try {
                const res = await fetch('/api/notes', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if (res.ok) {
                    const data = await res.json();
                    alertBox.className = 'alert success';
                    alertBox.textContent = `✅ Нотатку успішно збережено у notes/${data.category}/${data.filename}!`;
                    form.reset();
                } else {
                    alertBox.className = 'alert';
                    alertBox.style.display = 'block';
                    alertBox.style.backgroundColor = '#fee2e2';
                    alertBox.style.color = '#b91c1c';
                    alertBox.textContent = '❌ Помилка при збереженні нотатки.';
                }
            } catch (err) {
                alertBox.className = 'alert';
                alertBox.style.display = 'block';
                alertBox.style.backgroundColor = '#fee2e2';
                alertBox.style.color = '#b91c1c';
                alertBox.textContent = '❌ Помилка з\'єднання з сервером: ' + err.message;
            }
        });
    </script>
</body>
</html>
